[project]
name = "taschenmesser"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "pypdfium2>=4.30", "pillow>=10", "olefile>=0.46"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "reportlab>=4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
