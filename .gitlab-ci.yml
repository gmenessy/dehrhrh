stages: [check, integration]

variables:
  UV_CACHE_DIR: .uv-cache
  UV_PYTHON_DOWNLOADS: never

.uv:
  image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq make
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

check:
  extends: .uv
  stage: check
  script:
    - uv sync --all-packages --frozen
    - make check

test-int:
  stage: integration
  image: docker:29
  services: [docker:29-dind]
  when: manual
  variables:
    DEV_BIND: 0.0.0.0
    PLATTFORM_TEST_HOST: docker
  before_script:
    - apk add --no-cache make bash python3 py3-pip
    - pip install --break-system-packages uv==0.11.32
  script:
    - make setup
    - make test-int
  after_script:
    - make down
