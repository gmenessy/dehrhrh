[project]
name = "kern"
version = "0.1.0"
description = "Gemeinsame Bibliothek der Plattform."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "granian",
    "prometheus-client",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "httpx[http2]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kern"]
